[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blade"
version = "0.1.0"
description = "BLADE runtime authorization proxy: block BOLA/IDOR by enforcing per-endpoint authorization policies in front of your API."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "aiohttp>=3.9,<4", "pydantic>=2,<3",
  "pyyaml>=6,<7", "pyjwt>=2,<3", "sqlalchemy>=2,<3",
  "httpx>=0.27,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "redis>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
rag = ["chromadb==1.0.20", "sentence-transformers==3.4.1", "transformers==4.48.3", "torch==2.6.0", "numpy==1.26.4",
       "huggingface-hub==0.28.1", "scikit-learn==1.6.1", "scipy==1.15.2", "tokenizers==0.21.0", "safetensors==0.5.3"]
controller = ["tree-sitter>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24"]

[tool.setuptools.packages.find]
include = ["common*", "pipeline*", "admin_api*", "proxy*", "prompts*"]

[tool.setuptools.package-data]
prompts = ["*.md"]
"pipeline.rag" = ["idioms/*.md"]
